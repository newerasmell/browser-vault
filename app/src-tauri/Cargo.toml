[package]
name = "browser-vault"
description = "Browser Vault — menu bar app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "browser-vault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vault-core = { path = "../../crates/vault-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.8"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSDistributedNotificationCenter", "NSString", "NSOperation", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSWorkspace", "NSRunningApplication"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
