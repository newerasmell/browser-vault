[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Approved crypto crates (SPEC §2). Do not add others without approval.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
# TOTP (RFC 6238) and the setup QR code (SPEC §2, §4.1).
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "zeroize"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Approved 2026-11-04 by the owner for ONE purpose: re-encrypting Brave's
# own cookie/password values (Chromium "v10" format on macOS: PBKDF2-SHA1
# + AES-128-CBC) from the Mac's Keychain key to the portable key, so a
# vault's logins work on another Mac. Not used for our own crypto.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

# Non-crypto support crates.
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = "1"

# FIDO2 / CTAP2 over USB HID (SPEC §2, approved). Needs hidapi; on Linux the
# build links libudev (CI installs `libudev-dev`).
ctap-hid-fido2 = "3.6"

# Secure Enclave via SecKey (SPEC §2, §4.1).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[features]
# TEST ONLY: password-only keyslot for M1/M2 tests and E2E. Never enable in
# the app build: a release must not be able to open a password-only vault.
test-password-slot = []
# TEST ONLY: software mocks of hardware backends (`fido2::MockAuthenticator`,
# `se::MockSecureEnclave`) for tests in this and dependent crates. Never
# enable in the app build.
test-mocks = []

[[test]]
name = "e2e_macos"
required-features = ["test-password-slot"]

[[test]]
name = "e2e_import_macos"
required-features = ["test-password-slot"]

[dev-dependencies]
tempfile = "3"
