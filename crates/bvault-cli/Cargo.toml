[package]
name = "bvault-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bvault"
path = "src/main.rs"

[features]
# Dev/test builds only: allows `--password-only` vaults (no second factor).
test-password-slot = ["vault-core/test-password-slot"]

[dependencies]
vault-core = { path = "../vault-core" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zeroize = "1"
