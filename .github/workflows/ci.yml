name: CI

on:
  push:
    branches: [main, 'wip/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux — fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hidapi (via ctap-hid-fido2) links libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system packages (app crate compiles on Linux too)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  macos:
    name: macOS — unit + E2E (hdiutil, browsers)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The macos-14 (Apple Silicon) runner has a working Secure Enclave for
      # non-permanent keys, unsigned binary included.
      - name: E2E Secure Enclave (TOTP)
        timeout-minutes: 10
        run: cargo test -p vault-core --all-features --test e2e_se -- --ignored --nocapture --test-threads=1
      - name: Install browsers
        run: brew install --cask brave-browser firefox
      - name: E2E (ignored tests)
        timeout-minutes: 10
        run: cargo test -p vault-core --all-features --test e2e_macos -- --ignored --nocapture --test-threads=1
      - name: E2E import / cleanup (M7b, ignored tests)
        timeout-minutes: 10
        if: success() || failure()
        run: cargo test -p vault-core --all-features --test e2e_import_macos -- --ignored --nocapture --test-threads=1
