name: CI

on:
  push:
    branches: [main, 'wip/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux — fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  macos:
    name: macOS — unit + E2E (hdiutil, browsers)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # TEMPORARY probe (M3): does the runner VM have a usable Secure Enclave?
      - name: Probe Secure Enclave (e2e_se, may fail in a VM)
        continue-on-error: true
        run: cargo test -p vault-core --all-features --test e2e_se -- --ignored --nocapture --test-threads=1
      - name: Install browsers
        run: brew install --cask brave-browser firefox
      - name: E2E (ignored tests)
        run: cargo test -p vault-core --all-features --test e2e_macos -- --ignored --nocapture --test-threads=1
