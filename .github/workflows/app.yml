name: App (macOS DMG)

on:
  push:
    branches: [main, 'wip/**']
    tags: ['v*']
    # Path filters are not applied to tag pushes, so tags always build.
    paths:
      - 'app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.4

jobs:
  dmg:
    name: Build universal .app + .dmg (unsigned, ad-hoc)
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write # only used on v* tags (GitHub Release)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-universal
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: tauri build (universal-apple-darwin)
        working-directory: app/src-tauri
        run: npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target universal-apple-darwin --bundles app,dmg --ci

      - name: Locate bundle
        id: bundle
        run: |
          base=target/universal-apple-darwin/release/bundle
          dmg=$(ls "$base"/dmg/*.dmg | head -1)
          app=$(ls -d "$base"/macos/*.app | head -1)
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          ls -la "$base"/dmg "$base"/macos
          lipo -info "$app/Contents/MacOS/browser-vault"
          codesign -dv "$app" 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist"

      - name: Smoke test (launch for 15 s, must not crash)
        env:
          APP: ${{ steps.bundle.outputs.app }}
        run: |
          export BVAULT_HOME="$RUNNER_TEMP/bv-home"
          mkdir -p "$BVAULT_HOME"
          "$APP/Contents/MacOS/browser-vault" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::app exited early"
            cat "$RUNNER_TEMP/app.log"
            wait "$pid"; exit 1
          fi
          kill -TERM "$pid"; sleep 2; kill -9 "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/app.log"
          echo "app stayed up for 15 s"

      - uses: actions/upload-artifact@v4
        with:
          name: browser-vault-dmg
          path: ${{ steps.bundle.outputs.dmg }}
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.dmg }}
          draft: false
          prerelease: true
