[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/bvault-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# Argon2 is unusably slow without optimisation; keep it fast even in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
